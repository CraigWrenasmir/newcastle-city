<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newcastle City - Harbour Fishing</title>
<style>
  :root{
    --mac-grey:#dddddd;
    --mac-light:#ffffff;
    --mac-mid:#aaaaaa;
    --mac-dark:#555555;
    --mac-black:#000000;
    --menu-h:20px;
    --title-h:20px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Charcoal","Chicago","Geneva",Verdana,Tahoma,sans-serif;
    /* classic grey desktop pattern */
    background:#888 repeating-conic-gradient(#7d7d7d 0 25%,#929292 0 50%) 0 0/4px 4px;
    color:#000;overflow:hidden;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }

  /* ---- menu bar ---- */
  #menubar{
    position:fixed;top:0;left:0;right:0;height:var(--menu-h);z-index:10;
    background:#fff;border-bottom:1px solid #000;
    font-size:12px;line-height:19px;padding:0 10px;
    display:flex;gap:16px;align-items:center;white-space:nowrap;overflow:hidden;
  }
  #menubar .apple{font-size:14px;line-height:1}
  #menubar .right{margin-left:auto;display:flex;gap:14px}

  /* ---- the Mac window ---- */
  #win{
    position:fixed;z-index:1;
    top:calc(var(--menu-h) + 10px);left:10px;right:10px;bottom:10px;
    background:var(--mac-grey);
    border:1px solid #000;
    box-shadow:inset 1px 1px 0 var(--mac-light), inset -1px -1px 0 var(--mac-dark), 2px 2px 0 rgba(0,0,0,.6);
    display:flex;flex-direction:column;
  }
  #titlebar{
    height:var(--title-h);flex:none;position:relative;
    margin:1px;
    border-bottom:1px solid #000;
    background:
      repeating-linear-gradient(180deg, var(--mac-grey) 0 2px, #000 2px 3px) 0 3px / 100% calc(100% - 6px) no-repeat,
      var(--mac-grey);
    display:flex;align-items:center;justify-content:center;
  }
  #titlebar .box{
    position:absolute;top:3px;width:13px;height:13px;
    background:var(--mac-grey);border:1px solid #000;
    box-shadow:inset 1px 1px 0 #fff, inset -1px -1px 0 #888;
  }
  #titlebar .close{left:8px}
  #titlebar .zoom{right:8px}
  #titlebar .zoom::after{content:"";position:absolute;left:2px;top:2px;width:6px;height:6px;border:1px solid #000;border-right:0;border-bottom:0}
  #titlebar .collapse{right:26px}
  #titlebar .collapse::after{content:"";position:absolute;left:2px;top:5px;width:7px;height:1px;background:#000}
  #titlebar .name{
    position:relative;background:var(--mac-grey);padding:0 10px;
    font-size:12px;font-weight:bold;line-height:18px;letter-spacing:.2px;
  }
  #content{
    flex:1;position:relative;margin:0 1px 1px;overflow:hidden;
    border:1px solid #000;
    background:#000 url("assets/harbour-web.jpg") center center / cover no-repeat;
  }

  /* ---- the vertical skill bar: Frutiger Aero glass, floating off the photo ---- */
  #content{perspective:900px}
  #panel{
    position:absolute;z-index:4;
    left:20%;top:50%;
    transform:translate(-50%,-50%) rotateY(16deg) rotateX(5deg);
    transform-style:preserve-3d;
    width:118px;
    border-radius:26px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.18) 45%, rgba(170,215,255,.22) 50%, rgba(120,190,255,.35));
    -webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 6px rgba(0,60,120,.25),
      0 0 0 1px rgba(0,70,140,.25),
      34px 46px 48px rgba(0,20,50,.55),
      10px 14px 18px rgba(0,20,50,.35);
    padding:12px 10px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  /* glossy top-half reflection on the panel */
  #panel::before{
    content:"";position:absolute;left:4px;right:4px;top:3px;height:46%;
    border-radius:22px 22px 60px 60px / 22px 22px 30px 30px;
    background:linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.05));
    pointer-events:none;
  }
  /* soft ground shadow on the photo, well behind the floating panel */
  #panel::after{
    content:"";position:absolute;left:-10px;right:-30px;top:-10px;bottom:-30px;z-index:-1;
    border-radius:40px;
    background:radial-gradient(ellipse at center, rgba(0,20,50,.35), rgba(0,20,50,0) 70%);
    transform:translateZ(-160px) translate(60px,70px) scale(1.15);
    filter:blur(14px);
    pointer-events:none;
  }
  #panel h1{
    margin:0;font-size:11px;letter-spacing:2px;text-align:center;position:relative;
    color:#0a3a66;text-shadow:0 1px 0 rgba(255,255,255,.9);
  }

  /* glass capsule casing the tube sits inside */
  #trough{
    width:62px;height:min(54vh,420px);padding:7px;position:relative;
    border-radius:31px;
    background:linear-gradient(90deg, rgba(255,255,255,.25), rgba(255,255,255,.05) 40%, rgba(0,40,90,.18) 85%, rgba(0,40,90,.3));
    border:1px solid rgba(255,255,255,.8);
    box-shadow:
      inset 0 0 0 1px rgba(0,70,140,.25),
      inset 3px 0 8px rgba(255,255,255,.7),
      inset -4px 0 10px rgba(0,40,90,.35),
      inset 0 6px 10px rgba(255,255,255,.6),
      inset 0 -8px 12px rgba(0,40,90,.3),
      0 10px 18px rgba(0,20,50,.35);
  }
  #bar{
    position:relative;width:100%;height:100%;border-radius:24px;
    background:linear-gradient(180deg,
      #b20000 0%, #ff2a00 10%, #ff9900 25%, #ffe600 35%,
      #2bd12b 42%, #00a500 50%, #2bd12b 58%,
      #ffe600 65%, #ff9900 75%, #ff2a00 90%, #b20000 100%);
    box-shadow:
      inset -9px 0 12px rgba(0,0,0,.45),
      inset 3px 0 4px rgba(255,255,255,.45),
      inset 0 10px 10px -6px rgba(255,255,255,.7),
      inset 0 -12px 12px -6px rgba(0,0,0,.6),
      0 0 14px rgba(255,255,255,.35);
  }
  /* cylinder shading + glossy specular streak, Aero style */
  #bar::before{
    content:"";position:absolute;inset:0;border-radius:24px;
    background:
      linear-gradient(90deg,
        rgba(255,255,255,.05) 0%, rgba(255,255,255,.9) 14%, rgba(255,255,255,.45) 26%,
        rgba(255,255,255,0) 48%, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }
  #bar::after{
    content:"";position:absolute;left:18%;top:5%;width:14%;height:88%;border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.55) 20%, rgba(255,255,255,.15) 60%, rgba(255,255,255,.7));
    filter:blur(.6px);
    pointer-events:none;
  }
  /* green zone edge ticks */
  #bar .edge{position:absolute;left:-4px;right:-4px;height:2px;background:rgba(255,255,255,.85);box-shadow:0 1px 2px rgba(0,0,0,.6)}

  /* the marker: a glass-and-chrome needle across the tube */
  #marker{position:absolute;left:-14px;right:-10px;top:0;height:0;pointer-events:none;will-change:top}
  #marker .needle{
    position:absolute;left:0;right:0;top:-4px;height:8px;border-radius:4px;
    background:linear-gradient(180deg,#fff,#e4f2ff 40%,#8fb6d8 60%,#3b6a94);
    border:1px solid rgba(10,50,90,.9);
    box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 #fff;
  }
  #marker .cap{
    position:absolute;left:-18px;top:-12px;width:18px;height:24px;
    background:linear-gradient(180deg,#fff,#cfe6ff 45%,#6fa6d9 55%,#2f6ca6);
    border:1px solid rgba(10,50,90,.9);border-radius:7px 0 0 7px;
    box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 #fff;
  }
  #marker .cap::after{
    content:"";position:absolute;right:-11px;top:4px;
    border:7px solid transparent;border-left:10px solid #2f6ca6;
  }

  /* Aero glass push button */
  button.mac{
    font-family:inherit;font-size:12px;font-weight:bold;position:relative;
    width:100%;padding:6px 0;cursor:pointer;color:#083a66;
    background:linear-gradient(180deg,#ffffff,#dff0ff 48%,#9ccbf5 52%,#5fa9ea);
    border:1px solid rgba(10,60,110,.8);border-radius:14px;
    box-shadow:inset 0 1px 0 #fff, 0 4px 8px rgba(0,20,50,.4);
    text-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  button.mac:active{
    background:linear-gradient(180deg,#5fa9ea,#2f7fc8);color:#fff;text-shadow:none;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4);
  }
  #score{
    width:100%;font-size:10px;text-align:center;line-height:13px;position:relative;
    color:#083a66;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(230,243,255,.8));
    border:1px solid rgba(10,60,110,.5);border-radius:10px;padding:4px 2px;
    box-shadow:inset 0 1px 0 #fff, 0 2px 4px rgba(0,20,50,.3);
    font-family:"Monaco","Courier New",monospace;
  }

  /* message: a little Mac alert box beside the bar */
  #msg{
    position:absolute;z-index:4;
    left:calc(20% + 90px);top:50%;transform:translateY(-50%);
    width:min(240px,calc(80% - 110px));
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(235,246,255,.85));
    border:1px solid rgba(255,255,255,.9);border-radius:14px;
    box-shadow:0 0 0 1px rgba(0,70,140,.3), inset 0 1px 0 #fff, 12px 16px 24px rgba(0,20,50,.4);
    padding:12px 14px;color:#083a66;
    font-size:12px;line-height:16px;
  }
  #msg b.good{color:#007a2a}
  #msg b.bad{color:#b00000}

  /* whole-window hit area so taps anywhere count */
  #tap{position:absolute;inset:0;z-index:3}

  @media (max-width:600px){
    #panel{left:18%}
    #msg{left:auto;right:10px;top:auto;bottom:12px;transform:none;width:calc(100% - 20px)}
    #trough{height:min(50vh,360px)}
  }
</style>
</head>
<body>

<div id="menubar">
  <span class="apple">&#63743;</span>
  <span><b>File</b></span><span>Edit</span><span>View</span>
  <span class="right"><span id="clock"></span></span>
</div>

<div id="win">
  <div id="titlebar">
    <span class="box close"></span>
    <span class="name">Newcastle Harbour</span>
    <span class="box collapse"></span>
    <span class="box zoom"></span>
  </div>
  <div id="content">
    <div id="tap"></div>

    <div id="panel">
      <h1>FISHING</h1>
      <div id="trough">
        <div id="bar">
          <div class="edge" id="edgeT"></div>
          <div class="edge" id="edgeB"></div>
          <div id="marker"><div class="cap"></div><div class="needle"></div></div>
        </div>
      </div>
      <button class="mac" id="cast">Cast</button>
      <div id="score">HITS 0<br>BEST 0</div>
    </div>

    <div id="msg">Press <b>Cast</b>, then hit <b>SPACE</b>, click, or tap when the marker is in the green.</div>
  </div>
</div>

<script>
(function(){
  // ---- tuning ----
  const GREEN = [0.40, 0.60];     // fraction of the bar that counts as a catch
  const PERFECT = [0.47, 0.53];   // extra praise if you hit the heart of it
  const BASE_SPEED = 0.55;        // sweeps per second at the start
  const SPEED_GROWTH = 0.08;      // added per fish caught

  const marker = document.getElementById('marker');
  const msg = document.getElementById('msg');
  const cast = document.getElementById('cast');
  const scoreEl = document.getElementById('score');

  document.getElementById('edgeT').style.top = (GREEN[0]*100)+'%';
  document.getElementById('edgeB').style.top = (GREEN[1]*100)+'%';

  let running = false, t0 = 0, pos = 0.5, caught = 0, best = 0, raf = 0;
  try{ best = parseInt(localStorage.getItem('nc-fish-best')||'0',10)||0; }catch(e){}

  function speed(){ return BASE_SPEED + caught*SPEED_GROWTH; }
  function showScore(){ scoreEl.innerHTML = 'HITS '+caught+'<br>BEST '+best; }
  function place(p){ marker.style.top = (p*100)+'%'; }

  function frame(now){
    if(!running) return;
    const t = (now - t0)/1000;
    const phase = (t*speed()) % 1;
    const tri = phase < 0.5 ? phase*2 : 2 - phase*2;   // 0 -> 1 -> 0
    pos = 0.5 - 0.5*Math.cos(tri*Math.PI);              // ease at both ends
    place(pos);
    raf = requestAnimationFrame(frame);
  }

  function start(){
    running = true;
    t0 = performance.now() - Math.random()*800;
    msg.innerHTML = 'Wait for it... hit <b>SPACE</b>, click, or tap in the green!';
    cast.textContent = 'Stop';
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }

  function stop(){
    running = false;
    cancelAnimationFrame(raf);
    const p = pos;
    if(p >= GREEN[0] && p <= GREEN[1]){
      caught++;
      if(caught > best){ best = caught; try{ localStorage.setItem('nc-fish-best', String(best)); }catch(e){} }
      const perfect = p >= PERFECT[0] && p <= PERFECT[1];
      msg.innerHTML = perfect
        ? '<b class="good">PERFECT!</b> Dead centre. The next one is faster.'
        : '<b class="good">In the green!</b> The next one is faster.';
    }else{
      caught = 0;
      msg.innerHTML = '<b class="bad">Missed.</b> ' + (p < GREEN[0] ? 'Too high.' : 'Too low.') + ' Try again.';
    }
    showScore();
    cast.textContent = 'Cast';
  }

  function action(e){
    if(e && e.type === 'keydown'){
      if(e.code !== 'Space' && e.key !== 'Enter') return;
      e.preventDefault();
    }
    if(running) stop(); else start();
  }

  cast.addEventListener('click', function(e){ e.stopPropagation(); action(e); });
  document.getElementById('tap').addEventListener('pointerdown', action);
  document.getElementById('panel').addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return; action(e);
  });
  document.getElementById('msg').addEventListener('pointerdown', action);
  window.addEventListener('keydown', action);

  // menu bar clock, the old Mac way
  const clock = document.getElementById('clock');
  function tick(){
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    clock.textContent = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
  }
  tick(); setInterval(tick, 15000);

  showScore();
  place(0.5);
})();
</script>
</body>
</html>
